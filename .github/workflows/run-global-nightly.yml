name: Run Global Nightly

# The global nightly is a cron on the box, and on 2026-09-09 it had not run for a day and
# nobody could say why without an SSH session. This is the same SSH path deploy-global.yml
# uses, pointed at the orchestrator instead of the build, so the pipeline can be run — and its
# state read — from GitHub without a person typing on the box.
#
# Two modes:
#   status  read-only: cron entries for the nightly, the last nightly log's tail, the newest
#           gate A findings CSV, then scripts/ops/atlas_global_status.sh (code, build,
#           process, routes, database, nightly)
#   weekly  atlas_global_weekly.sh: build_identity, seed_benchmarks, ingest_index_membership.
#           MEMBERSHIP IS ONLY REFRESHED HERE, and the weekly had never been run — so
#           universe_snapshot was carrying whatever index_membership was first loaded with.
#           Gate A's two worst findings on 2026-09-09 were LAZR, which the live SSGA holdings
#           file says is NOT an S&P 500 member: a stale membership table was scoring a stock
#           that should not be in the universe at all. Same lock as the nightly, because both
#           write universe_snapshot.
#   run     the nightly itself, holding the SAME lock the cron uses for the WHOLE step, so a
#           run started here can neither overlap a scheduled one nor mistake a scheduled run's
#           log for its own; then the FAIL lines with their recorded reasons.
#   install_cron  (run mode) adds the runbook's cron line if no atlas_global_daily entry
#           exists.
#   update_checkout  (run mode) fast-forwards the box to origin/main first. deploy-global.yml
#           is the ONLY thing that moves the box's checkout, and it fires on frontend paths
#           alone — deliberately, since the nightly's Python changes no served byte. The cost
#           is that a Python-only fix to scripts/global_market/** never reaches the box, and a
#           run started here would then execute the OLD code and report a failure already
#           fixed. So run mode always PRINTS what it is about to run, and this input moves it.
#   set_box_env   (run mode) copies ALPACA_API_KEY, ALPACA_API_SECRET and EDGAR_IDENTITY from
#           GitHub Actions secrets into the box .env, so nobody has to SSH to add a key and no
#           credential is ever typed into this file. The values reach the box through the
#           action's `envs` passthrough, never interpolated into the script text, and only the
#           variable NAME is ever printed. A secret that is not set is skipped, not blanked.
#   backfill_prices  (run mode) runs ingest_prices.py --backfill once, before the nightly.
#           The nightly ingests prices INCREMENTALLY from a watermark and never pulls action
#           HISTORY, so putting the Alpaca key on the box fixes tomorrow's prices and leaves
#           gate A failing on splits from 2019 that were never adjusted for. This is the
#           one-off that fills that history and clears gate A's fourteen findings.
#   sync_deps     (run mode) installs the [global] extra into the box venv. The first real
#           nightly lost ingest_financials to `ModuleNotFoundError: No module named 'edgar'`
#           — the box venv had drifted from pyproject.toml and there was no way to repair it
#           without an SSH session.
#   seed_thresholds  (run mode) inserts any atlas_thresholds seed row the box has never had.
#           The same run lost mark_baskets to five missing basket keys.
#   fundamental_bands  (with seed_thresholds) ALSO cuts the 34 reachable fundamental bands from
#           the LIVE S&P 500 cross-section and seeds them. They are the only thresholds not
#           written down in seed_thresholds.py and they cannot be: India's ladder starts at ROE
#           20 because that is where India's index sits, and a ladder whose rungs all sit below
#           the S&P 500 puts every name on the top rung — the sub-score stops discriminating and
#           the board reads "all excellent" instead of "switched off". So they are DERIVED, by
#           the stated formula in atlas.global_market.fundamentals.bands over the real assembled
#           filings, printed in full before writing, and seeded — never overwriting a value the
#           FM has tuned. The three quick-ratio rungs are not cut: their input needs inventory,
#           which stock_financials_pit does not carry.
# Those six are everything this workflow ever writes to the box.
#
# EVERYTHING THIS PRINTS IS REDACTED FIRST. Actions logs on a public repository are public, and
# the orchestrator's own log is full of raw tracebacks — `requests` puts the whole request URL
# in an HTTPError, so one FRED 403 would publish an api_key to the internet. The orchestrator
# redacts the reason it stores in the database (scripts/ops/atlas_global_daily.sh::redact_secrets);
# this redacts the SAME patterns again on the way out of the box, because the log file itself
# was never redacted and never should be — it is the operator's full record.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "status (read-only), run (the nightly), or weekly (identity, benchmarks, S&P 500 membership)"
        required: true
        default: status
        type: choice
        options: [status, run, weekly]
      install_cron:
        description: "run mode only: install the runbook cron line if the box has none"
        required: false
        default: false
        type: boolean
      update_checkout:
        description: "run mode only: fast-forward the box checkout to origin/main before running"
        required: false
        default: false
        type: boolean
      set_box_env:
        description: "run mode only: write the Alpaca keys / EDGAR identity to the box .env from repo secrets"
        required: false
        default: false
        type: boolean
      backfill_prices:
        description: "run mode only: pull FULL price + corporate-action history first (needs the Alpaca key on the box)"
        required: false
        default: false
        type: boolean
      sync_deps:
        description: "run mode only: install the [global] extra into the box venv (adds only, removes nothing)"
        required: false
        default: false
        type: boolean
      seed_thresholds:
        description: "run mode only: insert missing atlas_thresholds seed rows (never overwrites an edit)"
        required: false
        default: false
        type: boolean
      fundamental_bands:
        description: "with seed_thresholds: ALSO cut the 34 fundamental bands from the live S&P 500 cross-section"
        required: false
        default: false
        type: boolean
      clear_lock:
        description: "kill whatever holds /tmp/atlas_global.lock first — for a run that hung, never for one that is working"
        required: false
        default: false
        type: boolean
      apply_ddl:
        description: "apply scripts/global_market/ddl/*.sql to prod (idempotent; adds missing tables and columns)"
        required: false
        default: false
        type: boolean
      nport_funds:
        description: "seed ETF holdings from SEC N-PORT: how many funds to fetch this run (0 skips it)"
        required: false
        default: "0"
        type: string

concurrency:
  group: global-nightly
  cancel-in-progress: false

jobs:
  nightly:
    name: ${{ inputs.mode }} the global nightly on the box
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: ${{ inputs.mode }} on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Empty when the secret is not set; the script skips an empty value rather than
          # writing a blank line over a working one.
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
        with:
          envs: ALPACA_API_KEY,ALPACA_API_SECRET,EDGAR_IDENTITY
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 70m
          # Every command carrying quotes stays on ONE line: a line indented below this block
          # scalar's indent ENDS the scalar (tests/unit/test_workflow_files_parse.py).
          script: |
            set -uo pipefail
            REPO=/home/ubuntu/atlas-os
            MODE="${{ inputs.mode }}"

            # The log directory the ORCHESTRATOR will use, by its own precedence: an exported
            # ATLAS_LOG_DIR wins, then the box .env, then its default. Hardcoding
            # /home/ubuntu/logs would make `run` report "NO NEW LOG" after a perfectly good run
            # on any box that overrides it, and `status` would read nothing at all.
            ENV_LOG_DIR=$(grep -sE '^ATLAS_LOG_DIR=' "$REPO/.env" | tail -1 | sed -E 's/^[^=]*=//; s/#.*$//; s/^[[:space:]]*"?//; s/"?[[:space:]]*$//' || true)
            LOGS="${ATLAS_LOG_DIR:-${ENV_LOG_DIR:-/home/ubuntu/logs}}"
            echo "log directory: $LOGS"
            CRON_LINE="0 1 * * 2-6   flock -n /tmp/atlas_global.lock $REPO/scripts/ops/atlas_global_daily.sh >> $LOGS/atlas_global_daily_cron.log 2>&1"

            # The redaction every line printed from this box passes through: URL passwords,
            # Bearer/Basic credentials, and the value after any key/token/secret/password/
            # authorization/APCA-API-* assignment. Same patterns as the orchestrator's.
            redact() { sed -E -e 's#://([^:/@[:space:]]+):[^@[:space:]]*@#://\1:***@#g' -e 's#((api[_-]?key|apikey|access[_-]?token|client[_-]?secret|secret[_-]?key|secret|token|password|passwd|pwd|authorization)[[:space:]]*[=:][[:space:]]*)[^\&[:space:]]+#\1***#Ig' -e 's#((bearer|basic|apca-api-[a-z-]+)[[:space:]:=]+)[^[:space:]]+#\1***#Ig'; }

            echo "== cron entries mentioning atlas_global_daily =="
            crontab -l 2>/dev/null | grep -n atlas_global_daily | redact || echo "NONE — the nightly is not scheduled on this box"

            echo "== newest nightly log =="
            LAST=$(ls -1t "$LOGS"/atlas_global_daily_[0-9]*.log 2>/dev/null | head -1 || true)
            if [ -n "$LAST" ]; then echo "$LAST ($(date -u -r "$LAST" +%FT%TZ))"; tail -n 25 "$LAST" | redact; else echo "none under $LOGS"; fi

            # The gate that withholds the board's publish, in full. Gate A hard-fails on price
            # moves that cannot be prices, names three of them in the log, and writes the rest
            # to a CSV on the box that nobody off the box can read — so the failure has been
            # visible and un-actionable at the same time. The file is symbols, dates and ratios
            # over public market data, no positions and no client data, and it goes through the
            # same redact() as everything else here. No input names it: the newest is always the
            # one the last run wrote, and a free-text filename would be a path this script
            # interpolates into a shell command.
            GATE_A=$(ls -1t "$LOGS"/gate_a_*.csv 2>/dev/null | head -1 || true)
            if [ -n "$GATE_A" ]; then
              echo "== $(basename "$GATE_A"): $(($(wc -l < "$GATE_A") - 1)) finding(s) =="
              head -n 120 "$GATE_A" | redact
            fi

            if [ "$MODE" = "status" ]; then
              echo "== who holds /tmp/atlas_global.lock =="
              LH=$(fuser /tmp/atlas_global.lock 2>/dev/null | tr -s ' ' '\n' | grep -E '^[0-9]+$' || true)
              [ -z "$LH" ] && LH=$(for d in /proc/[0-9]*; do for fd in "$d"/fd/*; do [ "$(readlink "$fd" 2>/dev/null)" = "/tmp/atlas_global.lock" ] && basename "$d" && break; done; done 2>/dev/null || true)
              if [ -z "$LH" ]; then echo "  FREE"; else for pid in $LH; do echo "  pid $pid  $(ps -o etime=,args= -p "$pid" 2>/dev/null | sed 's/^ *//' | cut -c1-140 | redact || true)"; done; fi

              # THE STUCK-RUN ESCAPE HATCH, and it is deliberately manual. The lock is what keeps
              # two pipelines off the same tables, so nothing here may clear it on a guess: a run
              # that is merely SLOW looks exactly like one that has hung. The operator decides,
              # having just read the holders and their elapsed times above.
              #
              # It exists because one did hang: the weekly's ingest_nport step had no --limit, ran
              # over the whole four-thousand-fund universe, and held the lock for four hours while
              # every dispatch was refused. TERM first so the orchestrator's own trap can write its
              # failure row; KILL only what is still there five seconds later.
              if [ "${{ inputs.clear_lock }}" = "true" ]; then
                if [ -z "$LH" ]; then echo "  clear_lock: nothing to clear"; else
                  echo "  clear_lock: TERM $LH"; kill -TERM $LH 2>/dev/null || true
                  sleep 5
                  STILL=$(for pid in $LH; do kill -0 "$pid" 2>/dev/null && echo "$pid"; done || true)
                  if [ -n "$STILL" ]; then echo "  clear_lock: KILL $STILL"; kill -KILL $STILL 2>/dev/null || true; fi
                  sleep 1
                  if fuser /tmp/atlas_global.lock >/dev/null 2>&1; then echo "  clear_lock: STILL HELD"; else echo "  clear_lock: lock is FREE"; fi
                fi
              fi

              echo "== S&P 500 fundamental cross-section (the 37 bands are set from this) =="
              XL=$(grep -l 'fundamental cross-section' $(ls -1t "$LOGS"/atlas_global_daily_[0-9]*.log 2>/dev/null | head -5) 2>/dev/null | head -1 || true)
              if [ -n "$XL" ]; then echo "  from $XL"; awk '/fundamental cross-section/{n=1} n && n++<16' "$XL" | redact; else echo "  no recent nightly log printed one"; fi

              echo "== atlas_global_status.sh =="
              bash "$REPO/scripts/ops/atlas_global_status.sh" 2>&1 | redact || true
              exit 0
            fi

            # TAKE THE LOCK OURSELVES AND HOLD IT for the rest of the step, rather than letting
            # `flock <file> <cmd>` release it the moment the orchestrator exits. Two reasons:
            # a scheduled run cannot start while we pick our log (which would let us read ITS
            # log and report it as ours), and a lock we could not get is a hard refusal here
            # instead of a confusing partial report.
            exec 9>/tmp/atlas_global.lock
            if ! flock -n 9; then
              echo "REFUSED: /tmp/atlas_global.lock is held — another run has the pipeline."
              HOLDERS=$(fuser /tmp/atlas_global.lock 2>/dev/null | tr -s ' ' '\n' | grep -E '^[0-9]+$' || true)
              [ -z "$HOLDERS" ] && HOLDERS=$(for d in /proc/[0-9]*; do for fd in "$d"/fd/*; do [ "$(readlink "$fd" 2>/dev/null)" = "/tmp/atlas_global.lock" ] && basename "$d" && break; done; done 2>/dev/null || true)
              for pid in $HOLDERS; do echo "  pid $pid  $(ps -o etime=,args= -p "$pid" 2>/dev/null | sed 's/^ *//' | cut -c1-140 | redact || true)"; done
              [ -z "$HOLDERS" ] && echo "  (no process holds it — a stale flock, or ps is restricted)"
              echo "  Nothing was started. Re-run this workflow once it finishes."
              exit 1
            fi

            if [ "${{ inputs.install_cron }}" = "true" ] && ! crontab -l 2>/dev/null | grep -q atlas_global_daily; then
              ( crontab -l 2>/dev/null; echo "$CRON_LINE" ) | crontab - || { echo "FAILED to install the cron line — not running the nightly"; exit 1; }
              echo "installed cron line: $(printf '%s' "$CRON_LINE" | redact)"
            fi

            # WHAT CODE IS THIS ABOUT TO RUN? Unconditional, because a nightly that quietly
            # executes a commit older than the fix you just merged reports a failure you have
            # already fixed, and nothing else in run mode would say so.
            timeout 20 git -C "$REPO" fetch origin main --quiet 2>/dev/null || echo "  (fetch failed — 'behind' is measured against the last known origin/main)"
            BEHIND=$(git -C "$REPO" rev-list --count HEAD..origin/main 2>/dev/null || echo "?")
            echo "== box checkout: $(git -C "$REPO" rev-parse --short HEAD 2>/dev/null || echo '?') ($BEHIND commit(s) behind origin/main) =="
            if [ "${{ inputs.update_checkout }}" = "true" ]; then
              git -C "$REPO" checkout main --quiet && git -C "$REPO" merge --ff-only origin/main || echo "REFUSED to fast-forward — the box has diverged, which a person must look at"
              echo "  checkout now at $(git -C "$REPO" rev-parse --short HEAD 2>/dev/null || echo '?')"
            elif [ "$BEHIND" != "0" ] && [ "$BEHIND" != "?" ]; then
              echo "  WARNING: running code $BEHIND commit(s) behind main. Re-run with update_checkout=true to move it."
            fi

            if [ "${{ inputs.sync_deps }}" = "true" ]; then
              echo "== box venv: installing the [global] extra (adds only) =="
              # NOT `uv sync`. uv sync is EXACT — it removes every package outside the extras it
              # is given, and INDIA'S PRODUCTION NIGHTLY RUNS FROM THIS SAME .venv with
              # [simulation]/[intelligence]/[optimizer]/[crawler]/[ui]. `uv sync --extra global`
              # would strip those and break atlas_daily.sh the same night. So read the [global]
              # extra's own requirement strings out of pyproject.toml — one source of truth, no
              # package list duplicated here — and `uv pip install` exactly those, which adds.
              REQ=/tmp/atlas_global_extra_reqs.txt
              "$REPO/.venv/bin/python" -c "import tomllib,pathlib,sys; d=tomllib.loads(pathlib.Path(sys.argv[1]).read_text()); pathlib.Path(sys.argv[2]).write_text(chr(10).join(d['project']['optional-dependencies']['global'])+chr(10))" "$REPO/pyproject.toml" "$REQ" || echo "could not read the [global] extra out of pyproject.toml"
              if [ -s "$REQ" ]; then
                echo "the [global] extra declares:"; sed 's/^/  /' "$REQ"
                UV="$(command -v uv || true)"
                for c in "$HOME/.local/bin/uv" "$HOME/.cargo/bin/uv" /usr/local/bin/uv; do [ -n "${UV:-}" ] && break; [ -x "$c" ] && UV="$c"; done
                if [ -n "${UV:-}" ]; then
                  VIRTUAL_ENV="$REPO/.venv" "$UV" pip install -r "$REQ" 2>&1 | tail -n 15 | redact || echo "INSTALL FAILED — ingest_financials will fail below for the same reason"
                else
                  echo "no uv on this box — run by hand:  VIRTUAL_ENV=$REPO/.venv uv pip install -r $REQ"
                fi
              fi
              rm -f "$REQ"
            fi

            if [ "${{ inputs.apply_ddl }}" = "true" ]; then
              echo "== atlas_global DDL: applying scripts/global_market/ddl/*.sql =="
              # Idempotent by construction (IF NOT EXISTS throughout, no DROP), so this IS the
              # normal way a new column reaches prod: merge the DDL edit, then run this once.
              # One transaction per file — a bad statement rolls back that file and stops.
              ( set -a; source "$REPO/.env"; set +a; cd "$REPO"; PYTHONPATH="$REPO:$REPO/scripts/global_market:$REPO/scripts/foundation" "$REPO/.venv/bin/python" scripts/global_market/apply_ddl.py ) 2>&1 | tail -n 30 | redact || echo "DDL FAILED — a writer whose column is missing will fail below for the same reason"
            fi

            if [ "${{ inputs.seed_thresholds }}" = "true" ]; then
              BANDS=""
              [ "${{ inputs.fundamental_bands }}" = "true" ] && BANDS="--fundamental-bands"
              echo "== atlas_global.atlas_thresholds: inserting any seed row the box has never had $BANDS =="
              # The writer is INSERT … ON CONFLICT (threshold_key) DO NOTHING, so a value the FM
              # tuned from /admin/thresholds is left exactly as it is; only never-seen keys are
              # added. Sourced .env never reaches the log: the script prints the DSN with its
              # credentials already stripped, and redact() runs over the output regardless.
              ( set -a; source "$REPO/.env"; set +a; cd "$REPO"; PYTHONPATH="$REPO:$REPO/scripts/global_market:$REPO/scripts/foundation" "$REPO/.venv/bin/python" scripts/global_market/seed_thresholds.py $BANDS ) 2>&1 | redact || echo "SEEDING FAILED — mark_baskets will fail below for the same reason"
            fi

            if [ "${{ inputs.set_box_env }}" = "true" ]; then
              echo "== box .env: taking credentials from repo secrets =="
              cp -p "$REPO/.env" "$REPO/.env.bak" && echo "  previous .env kept as .env.bak"
              for VAR in ALPACA_API_KEY ALPACA_API_SECRET EDGAR_IDENTITY; do
                eval "VAL=\${$VAR:-}"
                if [ -z "${VAL:-}" ]; then echo "  $VAR: no repo secret set — left alone"; continue; fi
                # Rewrite rather than sed -i: a value containing the delimiter would corrupt
                # the file, and a key or an email very well might. Only the NAME is printed.
                #
                # SINGLE-QUOTED, and this is not cosmetic. .env is SOURCED by the orchestrators
                # (`set -a; source .env`), so an unquoted value containing a space is parsed as
                # a command: EDGAR_IDENTITY=Nimish Shah nimish@... set the variable to "Nimish"
                # and then tried to RUN "Shah", which is exactly what the box reported —
                # ".env: line 75: Shah: command not found" — leaving the SEC contact truncated
                # to one word. Embedded single quotes are escaped the POSIX way ('"'"'\''"'"').
                grep -v "^$VAR=" "$REPO/.env" > "$REPO/.env.new" || true
                ESC=$(printf '%s' "$VAL" | sed "s/'/'\\\\''/g")
                printf "%s='%s'\n" "$VAR" "$ESC" >> "$REPO/.env.new"
                mv "$REPO/.env.new" "$REPO/.env" && chmod 600 "$REPO/.env"
                echo "  $VAR: written"
              done
            fi

            if [ "${{ inputs.backfill_prices }}" = "true" ]; then
              echo "== ingest_prices --backfill: full history, and the corporate actions gate A needs =="
              # Minutes, not hours: Alpaca's multi-symbol bars endpoint pages 10,000 points at
              # a time. If it does run long, the step's own 70m command_timeout bounds it and
              # the nightly below still runs on whatever landed — the writer is an upsert.
              ( set -a; source "$REPO/.env"; set +a; cd "$REPO"; PYTHONPATH="$REPO:$REPO/scripts/global_market:$REPO/scripts/foundation" "$REPO/.venv/bin/python" scripts/global_market/ingest_prices.py --backfill ) 2>&1 | tail -n 30 | redact || echo "BACKFILL FAILED — check ALPACA_API_KEY and ALPACA_API_SECRET are in $REPO/.env (that spelling: not ALPACA_SECRET_KEY)"
            fi

            NPORT_FUNDS="${{ inputs.nport_funds }}"
            if [ -n "$NPORT_FUNDS" ] && [ "$NPORT_FUNDS" != "0" ]; then
              echo "== ingest_nport: seeding ETF holdings for up to $NPORT_FUNDS fund(s) =="
              # The FIRST pass has no watermarks and fetches every document (AGG alone is
              # 15.9 MB), so it is seeded in batches rather than left to one 70-minute step —
              # heaviest traded funds first, and each run skips what the last one watermarked.
              # It commits every 50,000 rows, so being cut off by the timeout loses nothing.
              ( set -a; source "$REPO/.env"; set +a; cd "$REPO"; PYTHONPATH="$REPO:$REPO/scripts/global_market:$REPO/scripts/foundation" "$REPO/.venv/bin/python" scripts/global_market/ingest_nport.py --limit "$NPORT_FUNDS" --report "$LOGS/nport_seed_$(date -u +%FT%TZ).csv" ) 2>&1 | tail -n 40 | redact || echo "N-PORT SEEDING FAILED — check EDGAR_IDENTITY is in $REPO/.env and the DDL has been applied"
            fi

            if [ "$MODE" = "weekly" ]; then
              echo "== running the WEEKLY (started $(date -u +%FT%TZ)) =="
              bash "$REPO/scripts/ops/atlas_global_weekly.sh" 2>&1 | tail -n 60 | redact
              echo "== weekly finished $(date -u +%FT%TZ) =="
              exit 0
            fi

            echo "== running the nightly (started $(date -u +%FT%TZ)) =="
            bash "$REPO/scripts/ops/atlas_global_daily.sh" >> "$LOGS/atlas_global_daily_cron.log" 2>&1
            RC=$?
            echo "== finished $(date -u +%FT%TZ), orchestrator rc=$RC =="

            NEW=$(ls -1t "$LOGS"/atlas_global_daily_[0-9]*.log 2>/dev/null | head -1 || true)
            if [ -z "$NEW" ] || [ "$NEW" = "$LAST" ]; then
              echo "NO NEW LOG — the orchestrator did not get as far as opening one (.venv or .env missing?)"
              tail -n 20 "$LOGS/atlas_global_daily_cron.log" 2>/dev/null | redact
              exit 1
            fi

            echo "== $NEW: step outcomes =="
            grep -E '^  (ok|FAIL): ' "$NEW" | redact || true
            echo "== health snapshot =="
            grep -E 'health snapshot|write_health_snapshot' "$NEW" | redact || true
            echo "== last 40 lines =="
            tail -n 40 "$NEW" | redact
            exit "$RC"
