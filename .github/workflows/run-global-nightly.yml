name: Run Global Nightly

# The global nightly is a cron on the box, and on 2026-09-09 it had not run for a day and
# nobody could say why without an SSH session. This is the same SSH path deploy-global.yml
# uses, pointed at the orchestrator instead of the build, so the pipeline can be run — and its
# state read — from GitHub without a person typing on the box.
#
# Two modes:
#   status  read-only: cron entries for the nightly, the last nightly log's tail, then
#           scripts/ops/atlas_global_status.sh (code, build, process, routes, database, nightly)
#   run     the nightly itself, holding the SAME lock the cron uses for the WHOLE step, so a
#           run started here can neither overlap a scheduled one nor mistake a scheduled run's
#           log for its own; then the FAIL lines with their recorded reasons.
#   install_cron  (run mode) adds the runbook's cron line if no atlas_global_daily entry
#           exists.
#   sync_deps     (run mode) installs the [global] extra into the box venv. The first real
#           nightly lost ingest_financials to `ModuleNotFoundError: No module named 'edgar'`
#           — the box venv had drifted from pyproject.toml and there was no way to repair it
#           without an SSH session.
#   seed_thresholds  (run mode) inserts any atlas_thresholds seed row the box has never had.
#           The same run lost mark_baskets to five missing basket keys.
# Those three are everything this workflow ever writes to the box.
#
# EVERYTHING THIS PRINTS IS REDACTED FIRST. Actions logs on a public repository are public, and
# the orchestrator's own log is full of raw tracebacks — `requests` puts the whole request URL
# in an HTTPError, so one FRED 403 would publish an api_key to the internet. The orchestrator
# redacts the reason it stores in the database (scripts/ops/atlas_global_daily.sh::redact_secrets);
# this redacts the SAME patterns again on the way out of the box, because the log file itself
# was never redacted and never should be — it is the operator's full record.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "status (read-only) or run (the nightly, holding the cron's lock)"
        required: true
        default: status
        type: choice
        options: [status, run]
      install_cron:
        description: "run mode only: install the runbook cron line if the box has none"
        required: false
        default: false
        type: boolean
      sync_deps:
        description: "run mode only: install the [global] extra into the box venv (adds only, removes nothing)"
        required: false
        default: false
        type: boolean
      seed_thresholds:
        description: "run mode only: insert missing atlas_thresholds seed rows (never overwrites an edit)"
        required: false
        default: false
        type: boolean

concurrency:
  group: global-nightly
  cancel-in-progress: false

jobs:
  nightly:
    name: ${{ inputs.mode }} the global nightly on the box
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: ${{ inputs.mode }} on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 70m
          # Every command carrying quotes stays on ONE line: a line indented below this block
          # scalar's indent ENDS the scalar (tests/unit/test_workflow_files_parse.py).
          script: |
            set -uo pipefail
            REPO=/home/ubuntu/atlas-os
            MODE="${{ inputs.mode }}"

            # The log directory the ORCHESTRATOR will use, by its own precedence: an exported
            # ATLAS_LOG_DIR wins, then the box .env, then its default. Hardcoding
            # /home/ubuntu/logs would make `run` report "NO NEW LOG" after a perfectly good run
            # on any box that overrides it, and `status` would read nothing at all.
            ENV_LOG_DIR=$(grep -sE '^ATLAS_LOG_DIR=' "$REPO/.env" | tail -1 | sed -E 's/^[^=]*=//; s/#.*$//; s/^[[:space:]]*"?//; s/"?[[:space:]]*$//' || true)
            LOGS="${ATLAS_LOG_DIR:-${ENV_LOG_DIR:-/home/ubuntu/logs}}"
            echo "log directory: $LOGS"
            CRON_LINE="0 1 * * 2-6   flock -n /tmp/atlas_global.lock $REPO/scripts/ops/atlas_global_daily.sh >> $LOGS/atlas_global_daily_cron.log 2>&1"

            # The redaction every line printed from this box passes through: URL passwords,
            # Bearer/Basic credentials, and the value after any key/token/secret/password/
            # authorization/APCA-API-* assignment. Same patterns as the orchestrator's.
            redact() { sed -E -e 's#://([^:/@[:space:]]+):[^@[:space:]]*@#://\1:***@#g' -e 's#((api[_-]?key|apikey|access[_-]?token|client[_-]?secret|secret[_-]?key|secret|token|password|passwd|pwd|authorization)[[:space:]]*[=:][[:space:]]*)[^\&[:space:]]+#\1***#Ig' -e 's#((bearer|basic|apca-api-[a-z-]+)[[:space:]:=]+)[^[:space:]]+#\1***#Ig'; }

            echo "== cron entries mentioning atlas_global_daily =="
            crontab -l 2>/dev/null | grep -n atlas_global_daily | redact || echo "NONE — the nightly is not scheduled on this box"

            echo "== newest nightly log =="
            LAST=$(ls -1t "$LOGS"/atlas_global_daily_[0-9]*.log 2>/dev/null | head -1 || true)
            if [ -n "$LAST" ]; then echo "$LAST ($(date -u -r "$LAST" +%FT%TZ))"; tail -n 25 "$LAST" | redact; else echo "none under $LOGS"; fi

            if [ "$MODE" = "status" ]; then
              echo "== atlas_global_status.sh =="
              bash "$REPO/scripts/ops/atlas_global_status.sh" 2>&1 | redact || true
              exit 0
            fi

            # TAKE THE LOCK OURSELVES AND HOLD IT for the rest of the step, rather than letting
            # `flock <file> <cmd>` release it the moment the orchestrator exits. Two reasons:
            # a scheduled run cannot start while we pick our log (which would let us read ITS
            # log and report it as ours), and a lock we could not get is a hard refusal here
            # instead of a confusing partial report.
            exec 9>/tmp/atlas_global.lock
            if ! flock -n 9; then
              echo "REFUSED: /tmp/atlas_global.lock is held — a scheduled nightly is running now."
              echo "  Nothing was started. Re-run this workflow once it finishes."
              exit 1
            fi

            if [ "${{ inputs.install_cron }}" = "true" ] && ! crontab -l 2>/dev/null | grep -q atlas_global_daily; then
              ( crontab -l 2>/dev/null; echo "$CRON_LINE" ) | crontab - || { echo "FAILED to install the cron line — not running the nightly"; exit 1; }
              echo "installed cron line: $(printf '%s' "$CRON_LINE" | redact)"
            fi

            if [ "${{ inputs.sync_deps }}" = "true" ]; then
              echo "== box venv: installing the [global] extra (adds only) =="
              # NOT `uv sync`. uv sync is EXACT — it removes every package outside the extras it
              # is given, and INDIA'S PRODUCTION NIGHTLY RUNS FROM THIS SAME .venv with
              # [simulation]/[intelligence]/[optimizer]/[crawler]/[ui]. `uv sync --extra global`
              # would strip those and break atlas_daily.sh the same night. So read the [global]
              # extra's own requirement strings out of pyproject.toml — one source of truth, no
              # package list duplicated here — and `uv pip install` exactly those, which adds.
              REQ=/tmp/atlas_global_extra_reqs.txt
              "$REPO/.venv/bin/python" -c "import tomllib,pathlib,sys; d=tomllib.loads(pathlib.Path(sys.argv[1]).read_text()); pathlib.Path(sys.argv[2]).write_text(chr(10).join(d['project']['optional-dependencies']['global'])+chr(10))" "$REPO/pyproject.toml" "$REQ" || echo "could not read the [global] extra out of pyproject.toml"
              if [ -s "$REQ" ]; then
                echo "the [global] extra declares:"; sed 's/^/  /' "$REQ"
                UV="$(command -v uv || true)"
                for c in "$HOME/.local/bin/uv" "$HOME/.cargo/bin/uv" /usr/local/bin/uv; do [ -n "${UV:-}" ] && break; [ -x "$c" ] && UV="$c"; done
                if [ -n "${UV:-}" ]; then
                  VIRTUAL_ENV="$REPO/.venv" "$UV" pip install -r "$REQ" 2>&1 | tail -n 15 | redact || echo "INSTALL FAILED — ingest_financials will fail below for the same reason"
                else
                  echo "no uv on this box — run by hand:  VIRTUAL_ENV=$REPO/.venv uv pip install -r $REQ"
                fi
              fi
              rm -f "$REQ"
            fi

            if [ "${{ inputs.seed_thresholds }}" = "true" ]; then
              echo "== atlas_global.atlas_thresholds: inserting any seed row the box has never had =="
              # The writer is INSERT … ON CONFLICT (threshold_key) DO NOTHING, so a value the FM
              # tuned from /admin/thresholds is left exactly as it is; only never-seen keys are
              # added. Sourced .env never reaches the log: the script prints the DSN with its
              # credentials already stripped, and redact() runs over the output regardless.
              ( set -a; source "$REPO/.env"; set +a; cd "$REPO"; PYTHONPATH="$REPO:$REPO/scripts/global_market:$REPO/scripts/foundation" "$REPO/.venv/bin/python" scripts/global_market/seed_thresholds.py ) 2>&1 | redact || echo "SEEDING FAILED — mark_baskets will fail below for the same reason"
            fi

            echo "== running the nightly (started $(date -u +%FT%TZ)) =="
            bash "$REPO/scripts/ops/atlas_global_daily.sh" >> "$LOGS/atlas_global_daily_cron.log" 2>&1
            RC=$?
            echo "== finished $(date -u +%FT%TZ), orchestrator rc=$RC =="

            NEW=$(ls -1t "$LOGS"/atlas_global_daily_[0-9]*.log 2>/dev/null | head -1 || true)
            if [ -z "$NEW" ] || [ "$NEW" = "$LAST" ]; then
              echo "NO NEW LOG — the orchestrator did not get as far as opening one (.venv or .env missing?)"
              tail -n 20 "$LOGS/atlas_global_daily_cron.log" 2>/dev/null | redact
              exit 1
            fi

            echo "== $NEW: step outcomes =="
            grep -E '^  (ok|FAIL): ' "$NEW" | redact || true
            echo "== health snapshot =="
            grep -E 'health snapshot|write_health_snapshot' "$NEW" | redact || true
            echo "== last 40 lines =="
            tail -n 40 "$NEW" | redact
            exit "$RC"
