name: CI

# Pillar 2 of the engineering-process plan (docs/engineering-process.md):
# every PR must pass before it can merge. Blocks the class of bug that shipped
# by hand to prod (30-min MV refresh lock, breadth NOT-NULL crash) — they would
# have failed the migration-apply job below pre-merge.

on:
  pull_request:
  push:
    branches: [main]
  # Manually, on any branch. GitHub does not raise a `pull_request` event for every way a branch
  # can change — a pull request opened by an app token is one — and a branch that has been pushed
  # eight times with no CI run is a branch nobody can merge with confidence. This is the way to
  # ask for the same four jobs on demand; it runs exactly what a pull request runs.
  workflow_dispatch:

# A new push to a PR cancels the previous in-flight run for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-types-tests:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dev dependencies
        # + the global extra (openpyxl): the global-market unit tests import the SSGA parser
        # and the pyright ratchet resolves it — `uv sync` is exact, so it must be asked for.
        run: uv sync --extra dev --extra global

      - name: Ruff lint
        run: uv run ruff check atlas tests scripts

      - name: Ruff format check
        run: uv run ruff format --check atlas tests scripts

      - name: Pyright ratchet (no new type errors vs ci/pyright-baseline.json)
        run: uv run --extra dev python scripts/ci/pyright_ratchet.py

      - name: Unit tests (fast, no DB)
        run: uv run --extra dev pytest tests/unit tests/scripts -m unit -q

      # Rule #0 on files that cannot be committed (SSGA's notice; a 5.5 MB CSV): the
      # `live`-marked global-market tests fetch the real SSGA workbooks and fja05680 files at
      # test time. `required` makes an unreachable source a FAILURE, not a skip — these must RUN.
      - name: Live-file tests (global market, real downloads)
        env:
          ATLAS_LIVE_FIXTURES: required
        run: uv run --extra dev --extra global pytest tests/unit/global_market -m live -q

      # Rule #1 (ADR-0006): one schema per market, zero cross-schema references.
      # The India tree may not name atlas_global.*; the global tree may not name
      # atlas_foundation.* (an absent global tree scans clean).
      - name: Schema gate (india)
        run: uv run python scripts/ops/schema_gate.py --market india

      - name: Schema gate (global)
        run: uv run python scripts/ops/schema_gate.py --market global

      - name: Pragma finance-critical coverage gate (100%)
        run: uv run --extra dev bash scripts/ci/gate_pragma_coverage.sh

  migrations:
    name: Migrations apply on a fresh DB
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # BLOCKING. The 125-revision pre-consolidation chain (drifted from prod:
    # non-IMMUTABLE functional indexes, retired-subsystem migrations, dropped
    # schemas) was squashed into a single baseline — a verbatim pg_dump of the
    # live atlas_foundation schema (migrations/versions/0001_baseline_*). A fresh
    # DB now reproduces prod exactly, so this gate is real again.

    # Fresh Postgres per run — proves `alembic upgrade head` applies cleanly
    # before a migration can ever touch prod.
    services:
      postgres:
        # Match prod (Supabase is PG 17.6) so migrations apply against the same
        # major version that will run them for real.
        image: postgres:17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # AtlasConfig + alembic/env.py read ATLAS_DB_URL (psycopg2 driver).
      ATLAS_DB_URL: postgresql+psycopg2://atlas:atlas@localhost:5432/atlas_ci
      # Plain libpq URL for the psql seed step below.
      PGURL: postgresql://atlas:atlas@localhost:5432/atlas_ci

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Seed external DE-pipeline tables (de_*)
        # These tables are owned by the separate data-engineering pipeline, not
        # by atlas migrations — but migrations build MVs / indexes that read
        # them, so a fresh DB needs their (empty) schema first. The fixture is a
        # one-time `pg_dump --schema-only -t 'public.de_*'` captured from prod;
        # see ci/fixtures/README.md for how to regenerate it.
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f ci/fixtures/external_de_tables.sql

      - name: alembic upgrade head
        run: uv run alembic upgrade head

      # The identity build's apply() path on a real Postgres: build_identity.py runs twice
      # from the committed 2026-09-04 snapshot (13,154 listings; the second run must plan
      # nothing), then the rename / recycle / refusal scenarios. The migration above applied
      # the atlas_global DDL; the test truncates only the tables the script writes, before
      # and after, so the job's database is left as the migration made it.
      - name: Identity build round trip (build_identity.py on the fresh DB)
        env:
          ATLAS_IDENTITY_TEST_DB_URL: ${{ env.ATLAS_DB_URL }}
        run: uv run --extra dev pytest tests/integration/global_market/test_build_identity_db.py -m integration -q

  frontend:
    name: Frontend types + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The board is a Next.js app reading atlas_foundation directly. tsc guards the
    # schema→page coupling (a bad query type surfaces here, not at 3am in prod), and
    # the vitest suite covers the pure client logic (formatting, rank history, tone).
    # Neither ran in CI before — a dead-import tsc break shipped unnoticed until 2026-07.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm test
      # No `next build` here: the India board's db.ts throws at import when ATLAS_DB_URL is
      # unset, so its build cannot run without a Postgres. The global build step below was
      # attached to THIS job by mistake on 2026-09-08 and turned main red for three merges.

  frontend-global:
    name: Global board types + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Global Atlas board (frontend-global/) reads atlas_global through the transaction
    # pooler and is served from the box by pm2 (deploy-global.yml). Same gate as India: tsc guards
    # the schema→page coupling, vitest covers the pure formatters and the Lens bar's shape.
    # Playwright is local-only (playwright/smoke.spec.ts); it is not run here.
    defaults:
      run:
        working-directory: frontend-global
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-global/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm test
      # `next build` is the check tsc and vitest are not. On 2026-09-08 this job was green while
      # the build failed on the box. The empty DB URL is deliberate: db.ts treats an empty value
      # as "no database" and every page renders its honest no-database state, so the build
      # exercises routing, config and bundling without a Postgres. It CANNOT catch prerender
      # errors that need data to mount a component — root layout is force-dynamic for that.
      - name: Production build (next build)
        run: npm run build
        env:
          ATLAS_GLOBAL_DB_URL: ''
          ATLAS_GLOBAL_BASE_PATH: ''
